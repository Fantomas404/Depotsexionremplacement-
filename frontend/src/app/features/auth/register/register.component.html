<div class="min-h-[calc(100vh-10rem)] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
  <!-- Glowing Background Mesh -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-gradient-to-tr from-opti-primary/20 to-opti-accent/20 blur-[120px] rounded-full pointer-events-none -z-10"></div>

  <div class="max-w-md w-full card p-8 sm:p-10 shadow-2xl border-white/15 bg-[#181825]/75 backdrop-blur-2xl">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-opti-primary to-opti-accent text-[#1e1e2e] font-black text-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-opti-primary/25">
        SX
      </div>
      <h2 class="text-2xl font-black text-white tracking-tight">Inscription Candidat</h2>
      <p class="text-xs text-slate-400 mt-1">Créez votre compte en moins de 2 minutes pour postuler aux concours</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-danger mb-6">
        <span>⚠️</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="form-group mb-0">
          <label class="form-label">Nom de famille <span class="text-rose-400">*</span></label>
          <input
            type="text"
            [(ngModel)]="formData.nom"
            name="nom"
            required
            placeholder="ex: DIOP"
            class="form-input"
          />
        </div>

        <div class="form-group mb-0">
          <label class="form-label">Prénom(s) <span class="text-rose-400">*</span></label>
          <input
            type="text"
            [(ngModel)]="formData.prenom"
            name="prenom"
            required
            placeholder="ex: Awa"
            class="form-input"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Adresse Email <span class="text-rose-400">*</span></label>
        <input
          type="email"
          [(ngModel)]="formData.email"
          name="email"
          required
          placeholder="ex: awa.diop@gmail.com"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Numéro de Téléphone <span class="text-rose-400">*</span></label>
        <input
          type="tel"
          [(ngModel)]="formData.telephone"
          name="telephone"
          required
          placeholder="ex: 77 123 45 67"
          class="form-input"
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="form-group mb-0">
          <label class="form-label">Mot de passe <span class="text-rose-400">*</span></label>
          <input
            type="password"
            [(ngModel)]="formData.password"
            name="password"
            required
            placeholder="Min. 6 car."
            class="form-input"
          />
        </div>

        <div class="form-group mb-0">
          <label class="form-label">Confirmation <span class="text-rose-400">*</span></label>
          <input
            type="password"
            [(ngModel)]="formData.confirmPassword"
            name="confirmPassword"
            required
            placeholder="Répéter"
            class="form-input"
          />
        </div>
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary btn-lg w-full mt-2 shadow-lg shadow-opti-primary/25">
        @if (loading) {
          <span class="w-4 h-4 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></span>
        }
        {{ loading ? 'Création du compte...' : 'Créer mon compte candidat' }}
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      <span>Vous avez déjà un compte ?</span>
      <a routerLink="/auth/login" class="font-bold text-opti-primary hover:text-purple-300 transition-colors ml-1">
        Se connecter
      </a>
    </div>
  </div>
</div>
